{% extends "accounts/base.html" %}
{% block title %}Reset email sent{% endblock %}
{% block content %}
  <section class="account-card account-card-center">
    <p class="account-eyebrow">CHECK YOUR EMAIL</p>
    <h1>Reset request received</h1>
    <p class="account-intro">If an active account matches that email, a password reset link has been sent.</p>
    <a href="{% url 'accounts:login' %}" class="account-submit account-button-link">RETURN TO LOGIN</a>
  </section>
{% endblock %}
