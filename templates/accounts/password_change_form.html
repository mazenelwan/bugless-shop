{% extends "accounts/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
  <section class="account-card">
    <p class="account-eyebrow">ACCOUNT SECURITY</p>
    <h1>Change password</h1>
    <form method="post" class="account-form" novalidate>
      {% csrf_token %}
      {% include "accounts/partials/form_fields.html" %}
      <button type="submit" class="account-submit">CHANGE PASSWORD</button>
    </form>
  </section>
{% endblock %}
