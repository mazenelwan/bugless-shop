{% extends 'store/base.html' %}{% block title %}Checkout | Bugless Fit{% endblock %}{% block content %}<main class="checkout-page-sec" style="padding-top:8rem"><div class="container"><h1>Checkout</h1><div id="checkout-items"></div><p>Total: EGP <span id="total">0.00</span></p><form id="checkout-form">{% csrf_token %}<input required name="name" placeholder="Full Name"><input required name="email" type="email" placeholder="E-mail"><input required name="phone" placeholder="Phone Number"><input required name="address" placeholder="Address"><input name="city" placeholder="City"><textarea name="notes" placeholder="Order notes"></textarea><button>Confirm Order</button></form><p id="checkout-message"></p></div></main><script>const items=JSON.parse(localStorage.getItem('bfCart')||'[]');document.querySelector('#checkout-items').innerHTML=items.map(i=>`<p>${i.name} × ${i.qty}</p>`).join('');document.querySelector('#total').textContent=items.reduce((t,i)=>t+i.price*i.qty,0).toFixed(2);document.querySelector('#checkout-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),token=f.get('csrfmiddlewaretoken');const response=await fetch('{% url "create_order" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':token},body:JSON.stringify({customer:Object.fromEntries(f),items:items.map(i=>({product_id:i.id,quantity:i.qty,size:i.size||'',color:i.color||''}))})});const data=await response.json();if(response.ok){localStorage.removeItem('bfCart');location.href='/order/'+data.number+'/'}else document.querySelector('#checkout-message').textContent=data.error;};</script>{% endblock %}
